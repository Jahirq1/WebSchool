<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Login</h1>
                <select name="" id="" required>
                    <option value="">zgjedhni nje profesion</option>
                    <option value="">Student</option>
                    <option value="">Arsimtar</option>
                    <option value="">Profesor</option>
                </select>
                <div class="input-box">
                    <input type="number" placeholder="Id e perdoruesit" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Fjalekalimi" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                
                <button type="submit" class="btn">Login</button>
           
            </form>

        </div>

        <div class="form-box register">
            <form action="">
                <h1>Registration</h1> 
                 <select name="" id="" required>
                    <option value="">zgjedhni nje profesion</option>
                    <option value="">Student</option>
                    <option value="">Arsimtar</option>
                    <option value="">Profesor</option>
                </select>
                <div class="input-box">
                    <input type="number" placeholder="Shenoni ID" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Fjalkalimi" required>
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Rishkruaj fjalkalimin" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <button type="submit" class="btn">Register</button>
                
            </form>

        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 class="h1">Tung , Pershendetje!</h1>
                <p>Nuk keni nje llograri ?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1 class="h1">Mire se vini!</h1>
                <p>keni nje llograri tashme ?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>
    





    <script src="../js/login.js"></script>
</body>
</html>
