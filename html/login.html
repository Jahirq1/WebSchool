<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <div class="container">
        <div class="form-box login">
            <form action="" id="login-form">
                <h1>Login</h1>
                <select name="profesioni" id="profesioni"  required>
                    <option value="">zgjedhni nje profesion</option>
                    <option value="Student">Student</option>
                    <option value="Arsimtar">Arsimtar</option>
                    <option value="Prind">Prind</option>
                </select>
                <div class="input-box">
                    <input type="number" name="id" id="id" placeholder="Id e perdoruesit" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="fjalkalimi" placeholder="Fjalekalimi" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                
                <button type="submit" class="btn">Login</button>
           
            </form>

        </div>

        <div class="form-box register">
            <form action="" id="regjistrimi">
                <h1>Registration</h1> 
                 <select name="profesioni-r" id="profesioni-r" required>
                    <option value="">zgjedhni nje profesion</option>
                    <option value="Student">Student</option>
                    <option value="Arsimtar">Arsimtar</option>
                    <option value="Prind">Prind</option>
                </select>
                <div class="input-box">
                    <input type="number" id="id-r" name="id-r" placeholder="Shenoni ID" required>
                    <i class="bx bxs-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="paswordi-r" name="paswordi-r" placeholder="Fjalkalimi" required>
                    <i class="bx bxs-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password"  name="paswordi-r1" id="paswordi-r1" placeholder="Rishkruaj fjalkalimin" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>
                <button type="submit" class="btn">Register</button>
                
            </form>

        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1 class="h1">Tung , Pershendetje!</h1>
                <p>Nuk keni nje llograri ?</p>
                <button class="btn register-btn">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1 class="h1">Mire se vini!</h1>
                <p>keni nje llograri tashme ?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
    </div>
    





    <script src="../js/login.js"></script>
</body>
</html>
